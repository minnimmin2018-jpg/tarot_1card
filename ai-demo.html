<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 타로 체험</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #2a1256 0%, #150a30 45%, #08040f 100%);
    font-family:'Malgun Gothic','맑은 고딕',sans-serif; color:#f0e6ff;
    overflow:hidden; user-select:none;
  }
  #stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .star { position:absolute; background:#fff; border-radius:50%; animation:tw linear infinite; }
  @keyframes tw { 0%,100%{opacity:.15} 50%{opacity:.9} }

  .screen {
    position:absolute; inset:0; z-index:1;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 24px; text-align:center;
  }
  .screen.active { display:flex; animation:fade .5s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)} }

  .logo-slot {
    min-height:70px; margin-bottom:20px; display:flex; align-items:center; justify-content:center;
    font-size:.8rem; color:#6b5a9a; letter-spacing:1px;
  }
  .logo-slot img { max-height:90px; max-width:280px; }

  .gold {
    background:linear-gradient(90deg,#c9a96e,#f5d78e,#c9a96e);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  h1 { font-size:2.6rem; font-weight:900; letter-spacing:3px; margin-bottom:14px; }
  .sub { font-size:1.05rem; color:#c3b3e6; line-height:1.7; margin-bottom:40px; }

  .btn {
    border:none; cursor:pointer; font-family:inherit;
    padding:18px 46px; border-radius:40px; font-size:1.15rem; font-weight:bold; letter-spacing:1px;
    background:linear-gradient(135deg,#7c3aed,#c9a96e); color:#1a0533;
    box-shadow:0 8px 30px rgba(124,58,237,.35); transition:transform .18s;
  }
  .btn:active { transform:scale(.96); }
  .btn-ghost {
    background:transparent; border:2px solid #c9a96e; color:#f5d78e; box-shadow:none;
    padding:14px 34px; font-size:1rem;
  }

  textarea {
    width:100%; max-width:560px; height:150px; resize:none;
    background:rgba(255,255,255,.07); border:1.5px solid rgba(201,169,110,.4);
    border-radius:16px; color:#f0e6ff; font-size:1.15rem; font-family:inherit;
    padding:20px; outline:none; line-height:1.6; margin-bottom:26px;
  }
  textarea:focus { border-color:#c9a96e; }
  textarea::placeholder { color:#6b5a9a; }

  /* 카드 선택 */
  .deck { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:720px; margin-bottom:22px; }
  .pick {
    width:96px; height:150px; border-radius:12px; cursor:pointer;
    background:linear-gradient(145deg,#2d1b69,#1a0f3c); border:2px solid #c9a96e;
    display:flex; align-items:center; justify-content:center; position:relative;
    transition:transform .18s, box-shadow .18s;
  }
  .pick::before { content:''; position:absolute; inset:7px; border:1px solid rgba(201,169,110,.4); border-radius:7px; }
  .pick .q { font-size:2.2rem; color:#c9a96e; opacity:.7; }
  .pick:active { transform:translateY(-6px); }
  .pick.chosen { opacity:.25; pointer-events:none; transform:translateY(-6px); box-shadow:0 0 18px rgba(201,169,110,.5); }
  .slots { display:flex; gap:14px; justify-content:center; margin-bottom:6px; }
  .slot { width:60px; height:88px; border-radius:9px; border:2px dashed rgba(201,169,110,.35); display:flex; align-items:center; justify-content:center; font-size:.62rem; color:#8a7bb0; }
  .slot.filled { border-style:solid; border-color:#c9a96e; background:rgba(201,169,110,.12); }
  .pos-label { font-size:.72rem; color:#c9a96e; margin-top:4px; }

  /* 로딩 */
  .orb {
    width:120px; height:120px; border-radius:50%; margin-bottom:28px;
    background:radial-gradient(circle at 35% 30%,#a855f7,#4338ca);
    box-shadow:0 0 50px rgba(124,58,237,.6); animation:pulse 1.6s ease-in-out infinite;
    display:flex; align-items:center; justify-content:center; font-size:3.4rem;
  }
  @keyframes pulse { 0%,100%{transform:scale(1); opacity:.9} 50%{transform:scale(1.08); opacity:1} }
  .load-text { font-size:1.15rem; color:#d4c5f9; letter-spacing:1px; }

  /* 결과 */
  #screen-result { justify-content:flex-start; overflow-y:auto; padding-top:36px; padding-bottom:40px; }
  .result-wrap { width:100%; max-width:620px; }
  .concern-echo {
    background:rgba(168,85,247,.15); border:1px solid rgba(168,85,247,.4);
    border-radius:12px; padding:12px 18px; font-size:.92rem; color:#d8b4fe; margin-bottom:20px;
  }
  .cards-row { display:flex; gap:12px; justify-content:center; margin-bottom:24px; flex-wrap:wrap; }
  .rcard {
    width:120px; padding:14px 8px; border-radius:14px; text-align:center;
    background:linear-gradient(160deg,rgba(30,27,75,.9),rgba(49,46,129,.6));
    border:1px solid rgba(201,169,110,.4);
  }
  .rcard.rev { background:linear-gradient(160deg,rgba(75,27,40,.9),rgba(129,46,60,.6)); }
  .rcard .rp { font-size:.66rem; color:#a5b4fc; margin-bottom:6px; }
  .rcard .rsym { font-size:2rem; margin-bottom:4px; }
  .rcard .rn { font-size:.82rem; font-weight:bold; color:#f5d78e; margin-bottom:4px; }
  .rcard .ro { font-size:.62rem; padding:2px 8px; border-radius:8px; display:inline-block; }
  .ro.up { background:rgba(100,149,237,.25); color:#9ec3ff; }
  .ro.dn { background:rgba(220,80,100,.25); color:#ff9fb0; }

  .reading {
    background:rgba(255,255,255,.04); border:1px solid rgba(201,169,110,.25);
    border-radius:16px; padding:26px 24px; text-align:left; margin-bottom:24px;
  }
  .reading h3 {
    font-size:1rem; color:#c9a96e; letter-spacing:1px; margin:22px 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .reading h3:first-child { margin-top:0; }
  .reading h3::after { content:''; flex:1; height:1px; background:rgba(201,169,110,.2); }
  .reading p { font-size:1rem; color:#e8dcff; line-height:1.9; margin-bottom:6px; white-space:pre-line; }
  .badge-ai { display:inline-block; font-size:.7rem; color:#8a7bb0; margin-bottom:16px; letter-spacing:1px; }

  /* 오늘의 행운 */
  .lucky {
    background:linear-gradient(135deg,rgba(6,182,212,.12),rgba(124,58,237,.14));
    border:1px solid rgba(6,182,212,.35); border-radius:16px;
    padding:22px 20px; margin-bottom:24px;
  }
  .lucky-title { font-size:1rem; color:#7dd3e8; letter-spacing:1px; margin-bottom:16px; font-weight:bold; }
  .lucky-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px; }
  .lucky-box {
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    border-radius:12px; padding:14px 12px; display:flex; align-items:center; gap:12px;
  }
  .lucky-ico { font-size:1.7rem; }
  .lucky-swatch { width:30px; height:30px; border-radius:50%; border:2px solid rgba(255,255,255,.5); flex-shrink:0; }
  .lucky-k { font-size:.68rem; color:#9fb4d4; margin-bottom:3px; }
  .lucky-v { font-size:.95rem; font-weight:bold; color:#e8f4ff; }
  .lucky-msg {
    background:rgba(255,255,255,.05); border-radius:12px; padding:16px;
    text-align:center; font-size:1rem; color:#dbeafe; line-height:1.75; font-weight:500;
  }
  .lucky-msg .lm-label { font-size:.72rem; color:#7dd3e8; display:block; margin-bottom:8px; letter-spacing:1px; }

  .demo-note {
    position:fixed; top:10px; right:12px; z-index:5; font-size:.68rem; color:#8a7bb0;
    background:rgba(0,0,0,.3); padding:5px 12px; border-radius:20px; border:1px solid rgba(255,255,255,.08);
  }
</style>
</head>
<body>
<div id="stars"></div>
<div class="demo-note" id="demoNote">데모 모드 (API 키 미설정)</div>

<!-- 시작 -->
<section class="screen active" id="screen-start">
  <div class="logo-slot" id="logoSlot">[ 행사 로고 자리 ]</div>
  <h1 class="gold">AI 타로 상담소</h1>
  <p class="sub">당신의 고민을 들려주세요.<br>AI가 타로 카드에 담긴 답을 읽어드립니다.</p>
  <button class="btn" onclick="go('concern')">✨ 시작하기</button>
</section>

<!-- 고민 입력 -->
<section class="screen" id="screen-concern">
  <h1 style="font-size:1.8rem; margin-bottom:10px;">💭 어떤 고민이 있으신가요?</h1>
  <p class="sub" style="margin-bottom:24px;">마음속 이야기를 자유롭게 적어주세요.</p>
  <textarea id="concernInput" placeholder="예) 요즘 진로 때문에 너무 막막하고 불안해요. 지금 준비하는 길이 맞는 걸까요?"></textarea>
  <button class="btn" onclick="submitConcern()">다음 →</button>
</section>

<!-- 카드 선택 -->
<section class="screen" id="screen-cards">
  <h1 style="font-size:1.7rem; margin-bottom:6px;">🃏 카드를 3장 뽑아주세요</h1>
  <p class="sub" style="margin-bottom:18px;">마음이 가는 카드를 순서대로 선택하세요<br>(과거 · 현재 · 미래)</p>
  <div class="slots" id="slots">
    <div><div class="slot" id="slot0">과거</div></div>
    <div><div class="slot" id="slot1">현재</div></div>
    <div><div class="slot" id="slot2">미래</div></div>
  </div>
  <div class="deck" id="deck"></div>
</section>

<!-- 로딩 -->
<section class="screen" id="screen-loading">
  <div class="orb">🔮</div>
  <p class="load-text" id="loadText">별들이 당신의 이야기를 읽고 있어요...</p>
</section>

<!-- 결과 -->
<section class="screen" id="screen-result">
  <div class="result-wrap">
    <div class="badge-ai" id="aiBadge">✦ AI 맞춤 해석</div>
    <div class="concern-echo" id="concernEcho"></div>
    <div class="cards-row" id="cardsRow"></div>
    <div class="reading" id="reading"></div>
    <div class="lucky" id="lucky"></div>
    <div style="text-align:center;">
      <button class="btn-ghost" onclick="resetAll()">🔄 처음으로</button>
    </div>
  </div>
</section>

  AUTO_RESET_SEC: 90,

function buildLucky(cards){
  // 카드 번호 합으로 시드를 만들어 매번 다르되 카드와 연결되게
  const seed = cards.reduce((a,c)=>a+c.card.n+(c.rev?7:0),0) + Math.floor(Math.random()*99);
  const pick=(arr,off)=>arr[(seed+off)%arr.length];
  const num=(seed%9)+1;
  return {
    color: pick(LUCKY.colors,1),
    number: num,
    direction: pick(LUCKY.directions,2),
    item: pick(LUCKY.items,3),
    message: pick(LUCKY.messages,4),
  };
}

let concern = "";
let chosen = [];  // [{card, rev}]
let resetTimer = null;

/* ── 화면 전환 ── */
function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
}

function submitConcern(){
  const v = document.getElementById('concernInput').value.trim();
  concern = v || "지금 제 마음이 어떤지, 어떤 방향으로 가야 할지 봐주세요.";
  buildDeck();
  go('cards');
}

/* ── 카드 덱 만들기 ── */
function buildDeck(){
  chosen = [];
  [0,1,2].forEach(i=>{ const s=document.getElementById('slot'+i); s.className='slot'; s.textContent=POS[i]; });
  const deck = document.getElementById('deck');
  deck.innerHTML='';
  // 22장을 섞어서 배치
  const order = [...Array(CARDS.length).keys()].sort(()=>Math.random()-0.5);
  order.forEach(idx=>{
    const d=document.createElement('div');
    d.className='pick';
    d.innerHTML='<span class="q">?</span>';
    d.onclick=()=>choose(idx,d);
    deck.appendChild(d);
  });
}

function choose(idx,el){
  if(chosen.length>=3) return;
  const rev = Math.random()<0.35;
  chosen.push({card:CARDS[idx], rev});
  el.classList.add('chosen');
  const slot=document.getElementById('slot'+(chosen.length-1));
  slot.className='slot filled';
  slot.textContent=CARDS[idx].s;
  if(chosen.length===3){
    setTimeout(runReading, 500);
  }
}

/* ── 해석 실행 ── */
async function runReading(){
  go('loading');
  const msgs=["별들이 당신의 이야기를 읽고 있어요...","카드에 담긴 메시지를 풀어내는 중이에요...","조금만 기다려주세요, 곧 답이 도착해요..."];
  let mi=0; const li=setInterval(()=>{mi=(mi+1)%msgs.length; document.getElementById('loadText').textContent=msgs[mi];},1800);

  let reading;
  const useAI = CONFIG.API_KEY && CONFIG.API_KEY.trim().length>10;
  try {
    reading = useAI ? await callAI(concern, chosen) : null;
  } catch(e){ reading=null; }
  if(!reading) reading = localReading(concern, chosen);  // 실패/데모 시 폴백

  clearInterval(li);
  renderResult(reading, useAI && reading!==null);
}

/* ── 결과 렌더 ── */
function renderResult(text, byAI){
  document.getElementById('aiBadge').textContent = byAI ? '✦ AI 맞춤 해석' : '✦ 맞춤 해석 (데모)';
  document.getElementById('concernEcho').textContent = '💭 "'+concern+'"';
  const row=document.getElementById('cardsRow');
  row.innerHTML=chosen.map((c,i)=>`
    <div class="rcard ${c.rev?'rev':''}">

    </div>`).join('');

  // 오늘의 행운
  const lk=buildLucky(chosen);
  document.getElementById('lucky').innerHTML=`
    <div class="lucky-title">🍀 오늘의 행운</div>
    <div class="lucky-grid">
      <div class="lucky-box">
        <div class="lucky-swatch" style="background:${lk.color.hex}"></div>
        <div><div class="lucky-k">행운의 색</div><div class="lucky-v">${lk.color.name}</div></div>
      </div>
      <div class="lucky-box">
        <div class="lucky-ico">🔢</div>
        <div><div class="lucky-k">행운의 숫자</div><div class="lucky-v">${lk.number}</div></div>
      </div>
      <div class="lucky-box">
        <div class="lucky-ico">🧭</div>
        <div><div class="lucky-k">행운의 방향</div><div class="lucky-v">${lk.direction}</div></div>
      </div>
      <div class="lucky-box">
        <div class="lucky-ico">🎁</div>
        <div><div class="lucky-k">행운의 아이템</div><div class="lucky-v">${lk.item}</div></div>
      </div>
    </div>
    <div class="lucky-msg"><span class="lm-label">✦ 오늘의 한마디 ✦</span>${lk.message}</div>
  `;

  go('result');
  // 자동 초기화 예약
  clearTimeout(resetTimer);
  resetTimer=setTimeout(resetAll, CONFIG.AUTO_RESET_SEC*1000);

function resetAll(){
  clearTimeout(resetTimer);
  concern=""; chosen=[];
  document.getElementById('concernInput').value='';
  go('start');
}

/* ══════════════════════════════════════════════
   실제 AI 호출 (API 키 설정 시 작동)
   ══════════════════════════════════════════════ */
function buildPrompt(concern, cards){
  const cardLines = cards.map((c,i)=>
    `${POS[i]} 자리: ${c.card.ko}(${c.card.en}) ${c.rev?'역방향':'정방향'} — 의미: ${c.rev?c.card.dn:c.card.up}`
  ).join('\n');
  return `당신은 따뜻하고 지혜로운 타로 상담가입니다. 아래 내담자의 고민과 뽑은 3장의 카드를 바탕으로, ${CONFIG.TONE} 맞춤 해석을 한국어로 작성해주세요.

[내담자의 고민]
${concern}

[뽑은 카드]
${cardLines}

[작성 지침]
- 과거/현재/미래 흐름을 카드와 고민에 연결해 풀어주세요.
- 아래 형식의 제목(■)을 그대로 사용하고 각 항목을 2~4문장으로 충분히 써주세요.
- 마지막은 희망적이고 따뜻한 응원으로 마무리해주세요.

■ 지금 당신의 흐름
(과거·현재·미래 카드를 엮어 상황을 짚어주세요)

■ 고민에 대한 답
(내담자의 고민에 직접 답해주세요)

■ 오늘의 조언
(구체적이고 실천 가능한 조언)

■ 마음에 새길 한마디
(따뜻한 응원 한 문장)`;
}

async function callAI(concern, cards){
  const prompt=buildPrompt(concern,cards);
  let textOut;
  if(CONFIG.AI_PROVIDER==='openai'){
    const r=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+CONFIG.API_KEY},
      body:JSON.stringify({model:CONFIG.OPENAI_MODEL,max_tokens:900,messages:[{role:'user',content:prompt}]})
    });
    const d=await r.json(); textOut=d.choices?.[0]?.message?.content;
  } else {
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':CONFIG.API_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({model:CONFIG.CLAUDE_MODEL,max_tokens:900,messages:[{role:'user',content:prompt}]})
    });
    const d=await r.json(); textOut=d.content?.[0]?.text;
  }
  if(!textOut) return null;
  return formatReading(textOut);
}

// AI 텍스트(■ 제목 형식)를 HTML로 변환
function formatReading(t){
  const lines=t.split('\n'); let html=''; let buf=[];
  const flush=()=>{ if(buf.length){ html+='<p>'+buf.join('\n').trim()+'</p>'; buf=[]; } };
  lines.forEach(l=>{
    const s=l.trim();
    if(s.startsWith('■')){ flush(); html+='<h3>'+s.replace(/^■\s*/,'')+'</h3>'; }
    else if(s) buf.push(s);
  });
  flush();
  return html;
}

/* ══════════════════════════════════════════════
   데모용 로컬 해석 (API 키 없을 때 — 실제 느낌 재현)
   ══════════════════════════════════════════════ */
function localReading(concern, cards){
  const [p,c,f]=cards;
  const m=x=>x.rev?x.card.dn:x.card.up;
  const a=x=>x.rev?x.card.da:x.card.ua;
  const flow=`과거의 자리에 놓인 '${p.card.ko}'는 ${m(p)}의 기운을 보여줘요. 지금 당신이 겪는 상황의 뿌리가 여기에 있어요. 현재의 '${c.card.ko}'는 ${m(c)}를 말하고 있고, 이것이 지금 당신의 마음을 가장 크게 흔드는 부분이에요. 그리고 미래의 '${f.card.ko}'는 ${m(f)}로 향하고 있어요 — 흐름은 분명히 움직이고 있어요.`;
  const answer=`"${concern}" 라는 당신의 고민에, 세 장의 카드는 이렇게 답해요. 지금의 막막함은 끝이 아니라 지나가는 길목이에요. ${c.card.ko} 카드가 현재에 나온 건, 당신이 이미 답의 실마리를 손에 쥐고 있다는 뜻이기도 해요. 조급해하지 않아도 괜찮아요.`;
  const advice=`${a(c)} 그리고 미래를 위해서는, ${a(f)} 작은 실천 하나가 생각보다 큰 변화를 만들어낼 거예요.`;
  const closing=`당신은 생각보다 훨씬 단단한 사람이에요. 오늘 이 카드들이 건넨 말이, 당신의 하루에 작은 등불이 되길 바라요. 🌟`;
  return `<h3>지금 당신의 흐름</h3><p>${flow}</p>`+
         `<h3>고민에 대한 답</h3><p>${answer}</p>`+
         `<h3>오늘의 조언</h3><p>${advice}</p>`+
         `<h3>마음에 새길 한마디</h3><p>${closing}</p>`;
}
